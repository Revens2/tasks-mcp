# Passerelle MCP tasks — NetBird (CLI, Bearer statique).
# V1 : écoute NetBird uniquement (198.51.100.10:8793) + boucle locale.
# Phase 2 (ChatGPT/claude.ai) : ajouter ci-dessous le bloc public HTTPS sur
# 198.51.100.80:443 + 127.0.0.1:443 (même corps de règles), certificat Let's Encrypt
# (duckdns mcp.example.org), puis aligner TASKS_MCP_ISSUER dans l'env.
# Rien d'autre que /mcp et les routes OAuth n'est exposé ; le reste est coupé (444).

limit_req_zone  $binary_remote_addr zone=tasks_mcp_req:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=tasks_mcp_conn:10m;

log_format tasks_mcp_fmt '$time_local $remote_addr "$request_method $uri" $status ua="$http_user_agent" rt=$request_time';

server {
    listen 127.0.0.1:8793;
    listen 198.51.100.10:8793;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 20s;

    limit_req  zone=tasks_mcp_req burst=20 nodelay;
    limit_conn tasks_mcp_conn 10;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/tasks_mcp_access.log tasks_mcp_fmt;
    error_log  /var/log/nginx/tasks_mcp_error.log;

    # Seules les methodes utiles au MCP streamable-http (+ HEAD en decouverte).
    if ($request_method !~ ^(GET|HEAD|POST|DELETE|OPTIONS)$) { return 444; }

    # Routes OAuth (decouverte RFC 8414/9728, authorize, token, register, revoke,
    # consentement) : inutilisees tant que la passerelle n'est pas publique, mais
    # nécessaires aux tests et à la phase 2.
    location ~ ^/(\.well-known/|authorize$|token$|register$|revoke$|consentement$) {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
    }

    # /mcp : seule route MCP. Toute variante a slash final ou sous-chemin est coupee.
    location = /mcp/ { return 404; }
    location ~ ^/mcp/ { return 404; }

    location = /mcp {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE / streamable-http : pas de tampon, sessions longues.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location / { return 444; }
}
