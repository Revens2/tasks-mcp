# CalDAV tasks (Radicale) — NetBird UNIQUEMENT.
# V1 : certificat d'une CA privée locale (pki/caldav). Écoute uniquement sur l'adresse
# NetBird : l'Internet ne peut pas atteindre ce vhost (UFW refuse 5232 public, rien
# n'écoute sur 10.0.0.80:5232). Les pairs NetBird résolvent le nom via le DNS NetBird
# (vps-etude.netbird.selfhosted) ; l'IP 10.200.114.203 fonctionne aussi (SAN IP).
# Phase 2 (publique) : remplacer le certificat par un Let's Encrypt (duckdns) et ajouter
# un enregistrement local Pi-hole -> 10.200.114.203 pour le nom choisi.
server {
    listen 10.200.114.203:5232 ssl http2;
    server_name vps-etude.netbird.selfhosted caldav-vps.netbird.selfhosted;

    ssl_certificate     /srv/tasks/pki/caldav/fullchain.pem;
    ssl_certificate_key /srv/tasks/pki/caldav/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    # Les corps WebDAV (PROPFIND/calendar-query) restent petits ; une pièce jointe
    # éventuelle ne doit pas saturer.
    client_max_body_size 8m;
    client_body_timeout 60s;

    access_log /var/log/nginx/caldav_tasks_access.log;
    error_log  /var/log/nginx/caldav_tasks_error.log;

    # Toutes les méthodes CalDAV nécessaires à iOS (aucune restriction de méthode :
    # PROPFIND, REPORT, PUT, DELETE, MKCOL, MOVE, OPTIONS...).
    location / {
        proxy_pass http://127.0.0.1:5232;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering     on;
    }
}
