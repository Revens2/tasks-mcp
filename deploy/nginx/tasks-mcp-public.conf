# Tasks MCP — exposition publique ChatGPT (phase 2).
# Miroir exact du schéma calendar-mcp : duckdns + Let's Encrypt sur 198.51.100.80:443
# (routeur : 80/443 -> 198.51.100.80). Le vhost NetBird (tasks-mcp.conf, 8793) reste
# pour l'usage interne ; celui-ci sert ChatGPT/claude.ai via la passerelle OAuth
# tasks-gateway (127.0.0.1:8792) : routes OAuth publiques par nature + /mcp seul.
# Zones de limite dédiées (pas de doublon avec tasks-mcp.conf).

limit_req_zone  $binary_remote_addr zone=tasks_pub_req:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=tasks_pub_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.org;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 198.51.100.80:443 ssl http2;
    listen 127.0.0.1:443 ssl http2;
    server_name mcp.example.org;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 20s;

    limit_req  zone=tasks_pub_req burst=20 nodelay;
    limit_conn tasks_pub_conn 10;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /var/log/nginx/tasks_mcp_public_access.log;
    error_log  /var/log/nginx/tasks_mcp_public_error.log;

    # Seules les methodes utiles au MCP streamable-http (+ HEAD en decouverte).
    if ($request_method !~ ^(GET|HEAD|POST|DELETE|OPTIONS)$) { return 444; }

    # Routes OAuth (decouverte RFC 8414/9728, authorize, token, register, revoke,
    # consentement) : publiques par nature — c'est le flux de connexion de ChatGPT.
    location ~ ^/(\.well-known/|authorize$|token$|register$|revoke$|consentement$) {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    # Sante interne (utilisable par un moniteur NetBird si besoin).
    location = /health {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
    }

    # /mcp : seule route MCP. Toute variante a slash final ou sous-chemin est coupee.
    location = /mcp/ { return 404; }
    location ~ ^/mcp/ { return 404; }

    location = /mcp {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE / streamable-http : pas de tampon, sessions longues.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location / { return 444; }
}
